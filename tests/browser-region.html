<!doctype html><meta charset="utf-8"><title>Region edit browser integration</title><style>body{font:15px system-ui;margin:12px}iframe{width:100%;height:850px;border:1px solid #ccc}button{padding:10px}pre{white-space:pre-wrap}</style><h1>Region edit integration</h1><p>Synthetic source, mocked provider. No real API request.</p><button id="verify">Verify result pixels and request</button><pre id="status">Preparing</pre><iframe id="app"></iframe><script type="module">
import {loadHistory,saveHistory} from './history.js';
const status=document.querySelector('#status'),frame=document.querySelector('#app');const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;const ctx=canvas.getContext('2d');ctx.fillStyle='#f4efe5';ctx.fillRect(0,0,640,360);ctx.fillStyle='#2869dc';ctx.fillRect(80,120,100,100);ctx.fillStyle='#dc2d2d';ctx.fillRect(450,120,100,100);const source=ctx.getImageData(0,0,640,360).data;const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if((await loadHistory()).length)throw Error('QA origin history is not empty; refusing to replace');await saveHistory([{id:'synthetic-region-qa',number:1,created:Date.now(),kind:'生成',blob}]);localStorage.setItem('portrait-provider',JSON.stringify({baseUrl:'https://qa-provider.invalid/v1',key:'qa-placeholder',model:'qa-image',protocol:'edits'}));let sent=null;
frame.onload=()=>{const win=frame.contentWindow,native=win.fetch.bind(win);win.fetch=async(url,options)=>{if(String(url).startsWith('https://qa-provider.invalid/')){sent={fields:[...options.body.keys()],prompt:options.body.get('prompt')};if(options.body.has('mask'))throw Error('Remote mask must not be sent');if(options.body.getAll('image').length!==1)throw Error('Expected one image');const input=await createImageBitmap(options.body.get('image'));const c=document.createElement('canvas');c.width=input.width;c.height=input.height;c.getContext('2d').fillStyle='#00ef00';c.getContext('2d').fillRect(0,0,c.width,c.height);return new Response(JSON.stringify({data:[{b64_json:c.toDataURL('image/png').split(',')[1]}]}),{headers:{'Content-Type':'application/json'}})}return native(url,options)};status.textContent='Ready: edit the synthetic image in the workbench below, paint the red square, then submit.'};frame.src='./';
document.querySelector('#verify').onclick=async()=>{try{const doc=frame.contentDocument,im=doc.querySelector('#result');if(doc.querySelector('#resultTitle').textContent!=='编辑结果')throw Error('Edit has not completed');const c=document.createElement('canvas');c.width=640;c.height=360;c.getContext('2d').drawImage(im,0,0);const out=c.getContext('2d').getImageData(0,0,640,360).data;const mask=doc.querySelector('#selectionCanvas').getContext('2d').getImageData(0,0,640,360).data;let changed=0,unselectedChanged=0;for(let i=0;i<640*360;i++){let diff=false;for(let j=0;j<4;j++)if(out[i*4+j]!==source[i*4+j])diff=true;if(diff){changed++;if(!mask[i*4+3])unselectedChanged++}}if(!sent||!sent.prompt.includes('坐标原点在左上角'))throw Error('Coordinate prompt missing');if(!changed||unselectedChanged)throw Error('Invalid compositing: '+JSON.stringify({changed,unselectedChanged}));status.textContent='PASS '+JSON.stringify({changedPixels:changed,unselectedChangedPixels:unselectedChanged,fields:sent.fields,versions:(await loadHistory()).length})}catch(e){status.textContent='FAIL '+e.message}};
</script>
